name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [app, api, docs-site]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Test and build the web app
        if: matrix.project == 'app'
        env:
          NEXT_PUBLIC_OREN_API_URL: /api
        run: |
          pnpm test
          pnpm run build
      - name: Test and build the API
        if: matrix.project == 'api'
        run: |
          pnpm run typecheck
          pnpm test --runInBand
          pnpm run build
      - name: Validate and build the documentation
        if: matrix.project == 'docs-site'
        run: |
          node scripts/validate-content.mjs
          pnpm run build
          pnpm run types:check

  program:
    name: Solana program
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cargo check --locked --lib
