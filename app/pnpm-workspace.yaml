# minimumReleaseAge needs each version's publish time, which only the
# full registry document carries. @solana/assertions' document is ~12 MB
# and the GET stalls, so a long fetchTimeout turns one retry into a
# multi-minute hang. Fail that stall in 60s, twice. An unchanged
# lockfile skips the fetch when the metadata cache is restored.
# The supply-chain policy and the frozen lockfile are unchanged.
fetchTimeout: 60000
fetchRetries: 2

allowBuilds:
  # next-intl's plugin imports the extractor, which loads these native
  # packages when Next reads next.config. The scripts are approved so a
  # frozen install is not rejected for an unlisted build.
  '@parcel/watcher': true
  '@swc/core': true
  '@reown/appkit': false
  '@stellar/stellar-sdk': false
  blake-hash: false
  bufferutil: false
  keccak: false
  protobufjs: false
  sharp: false
  tiny-secp256k1: false
  unrs-resolver: false
  usb: false
  utf-8-validate: false

minimumReleaseAgeExclude:
  - elliptic@6.6.2
  - lodash@4.17.24
  - decode-uri-component@0.4.3
  - stream-json@3.4.1 || 3.5.1

overrides:
  'shell-quote@<1.11.0': 1.11.0
  'protobufjs@>=7.0.0 <7.6.1': 7.6.1
